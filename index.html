    ctx.setTransform(dpr,0,0,dpr,0,0);
  }`;h=h.replace(oldResize,newResize);const touch=`<style>#ipadTouch{display:none;position:fixed;z-index:99999;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));padding:0 18px;justify-content:space-between;pointer-events:none}.itc{display:flex;gap:9px}.itb{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;width:66px;height:66px;border-radius:50%;border:1px solid rgba(120,235,255,.5);background:rgba(5,15,38,.68);color:#fff;font:bold 19px Arial;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(70,220,255,.14);backdrop-filter:blur(8px)}.itb:active{transform:scale(.92)}@media(pointer:coarse),(hover:none){#ipadTouch{display:flex}}@media(pointer:coarse) and (max-height:700px){.itb{width:58px;height:58px;font-size:17px}#ipadTouch{padding:0 10px}}</style><div id="ipadTouch"><div class="itc"><button class="itb" data-code="ArrowLeft">◀</button><button class="itb" data-code="ArrowRight">▶</button></div><div class="itc"><button class="itb" data-code="ArrowDown">✦</button><button class="itb" data-code="KeyS">S</button><button class="itb" data-code="KeyL">L</button><button class="itb" data-code="Space">⬆</button></div></div><script>(()=>{const fire=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,bubbles:true}));document.querySelectorAll('#ipadTouch .itb').forEach(b=>{const c=b.dataset.code;const on=e=>{e.preventDefault();fire('keydown',c)};const off=e=>{e.preventDefault();fire('keyup',c)};b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('pointerleave',off,{passive:false});b.addEventListener('contextmenu',e=>e.preventDefault())});document.getElementById('ipadTouch').addEventListener('touchmove',e=>e.preventDefault(),{passive:false})})()<\/script>`;h=h.replace(/<\/body>/i,touch+'</body>');document.open();document.write(h);document.close()})().catch(e=>document.body.text
